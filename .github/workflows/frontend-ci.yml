name: OFAC Country KYC Compliance · Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'contracts/**'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify reviewer evidence
        run: npm run verify:repository
      - name: Build frontend
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: subodh-kyc-frontend-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
